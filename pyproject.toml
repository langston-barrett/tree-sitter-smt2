[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=62.4.0", "wheel"]

[project]
authors = [{ email = "langston.barrett@gmail.com", name = "Langston Barrett" }]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "SMT-LIB 2 grammar for tree-sitter"
keywords = ["incremental", "parsing", "tree-sitter", "smt2"]
license.text = "MIT"
name = "tree-sitter-smt2"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/langston-barrett/tree-sitter-smt2"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
