# https://langston-barrett.github.io/lun/

mtime = true

# -------------------------------------
# gha

[[linter]]
name = "zizmor"
cmd = "zizmor --"
files = ["**/.github/**/*.yml"]
ignore = ["**/.github/dependabot.yml"] # zizmor#1341

# -------------------------------------
# json

[[linter]]
name = "jq"
cmd = "jq null --"
files = ["*.json"]

# -------------------------------------
# md

[[linter]]
name = "mdlynx"
cmd = "mdlynx --"
files = ["*.md"]

[[linter]]
name = "typos"
cmd = "typos --"
files = ["*.md"]
fix = "typos --color=always --write-changes --"

# -------------------------------------
# sh

[[linter]]
name = "shellcheck"
cmd = "shellcheck --color=always --shell=bash --"
files = [
  "**/script/differential",
  "**/script/fetch-corpus",
  "**/script/list-corpus",
]

# -------------------------------------
# toml

[[formatter]]
name = "taplo"
cmd = "taplo format --"
files = ["*.toml"]
check = "taplo format --check --"

# -------------------------------------
# txt

[[linter]]
name = "ttlint"
cmd = "ttlint --"
files = ["*"]
ignore = [
  "**/src/grammar.json",
  "**/src/node-types.json",
  "**/src/parser.c",
  "**/src/tree_sitter/*",
  "**/test/corpus/*",
]
fix = "ttlint --fix --"
