[package]
authors = ["Langston Barrett <langston.barrett@gmail.com>"]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "SMT-LIB 2 grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "smt2"]
license = "MIT"
name = "tree-sitter-smt2"
readme = "README.md"
repository = "https://github.com/langston-barrett/tree-sitter-smt2"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"
